name: Deploy to Github

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run build

      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/client

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: deploy to github
        id: deployment
        uses: actions/deploy-pages@v5
