# Metadata for each route.
#  - Duration, Distance, and Stops could be calculated from the schedule.
#  - Direction could be replaced with isdown/isup.
#  - Shunt/Cross/Pass could be a string array instead of individual bools.
#
# Schedule entries consist of:
# StopName    - Pointer to the name of the station.
#               '&A16' above defines Nagara, so '*A16' should be used here.
# DrivingTime - Allotted time to arrive from the previous station. 'HH:MM:SS'
#               Not populated for the first stop.
# Arrive      - The scheduled arrival time for the train. 'HH:MM:SS'
#               Not popluated if the train will not stop at the station.
# Depart      - The scheduled departure (or passing) time of the train.
#               Not populated for the last stop.
# Track       - UNUSED - The line/track/platform the train aarrives on?
# SpeedLimit  - 'xx/yy' string denoting the speed limit(s.) 'xx' will appear
#               in the top left, 'yy' the bottom right. Either value can be
#               omitted, leaving the '/' to denote which number remains.
#               eg. '30/' or '/25'
# Article     - UNUSED - notes?
