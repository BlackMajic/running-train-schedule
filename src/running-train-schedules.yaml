# This section contains some basic data that will be used elsewhere. Anchors are
# defined with &<text> and used elsewhere using *<text>
_define:
  - &KR5000
    Train: KR5000
    Series: 5000
  - &HR1100
    Train: HR1100
    Series: 1100
  - &HR1500
    Train: HR1500
    Series: 1500
  - &DC8500
    Train: DC8500
    Series: 8500

  - &KR5000-2
    <<: *KR5000
    Cars: 2
  - &KR5000-4
    <<: *KR5000
    Cars: 4
  - &HR1100-2
    <<: *HR1100
    Cars: 2
  - &HR1100-4
    <<: *HR1100
    Cars: 4
  - &HR1500-3
    <<: *HR1500
    Cars: 3
  - &HR1500-6
    <<: *HR1500
    Cars: 6
  - &DC8500-4
    <<: *DC8500
    Cars: 4

  # Define some basic line data here, so we can anchor station names.
  - &KFLineData
    Name: &KFLine Kofuku Railway Fukugawa Line
    Station: # Down order
      - &K01 Ise
      - &K02 Murakami
      - &K03 Ise-Yamadera
      - &K04 Sayū
      - &K05 Kitami
      - &K06 Okamachi
      - &K07 Takahashi
    RollingStock:
      Local: &KFLocalTrains
        - *KR5000-2
        - *KR5000-4
        - *HR1100-2
        - *HR1100-4
  - &SMLineData
    Name: &SMLine Sanko Main Line
    Station:
      - &A16 Nagara
      - &A17 Imao-chō
      - &A18 Shiohama
      - &A19 Yūetsu
      - &A20 Kaguradai
      - &A21 Iwaminato
      - &A22 Ōmishima
      - &A23 Komori
      - &A24 Hayakawa
      - &A25 Ise
      - &A26 Kasugano
      - &A27 Nogata
      - &A28 Takahashi    #A30
      - &A29 Suzumenomiya #A29
      - &A30 Kanamori     #A28
    RollingStock:
      Local: &SMLocalTrains
        - *HR1500-3
        - *HR1500-6
        - *HR1100-2
        - *HR1100-4
      LtdExp: &SMLtdExpTrains
        - *DC8500-4

